<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Retake</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#edefe8" />
<style>
  /* The review surface. Retake is driven from an agent (or the workshop);
     this page is where a person watches, judges, and collects the output.
     It accepts no prose on purpose. */
  :root { --paper:#edefe8; --card:#f8f9f5; --ink:#191d19; --muted:#767e74; --rule:#dbdfd3; --rule2:#c9cec0; --accent:#1a1c1e; --amber:#e8b04b; --ok:#2f5d3f; --bad:#a23b2c; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink); font:15px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Inter, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  button, input { font:inherit; color:inherit; }
  .app { min-height:100%; display:flex; flex-direction:column; }
  .top { display:flex; align-items:center; gap:10px; padding:0 24px; height:56px; border-bottom:1px solid var(--rule); background:var(--paper); }
  .mark { width:22px; height:22px; border-radius:7px; background:var(--accent); position:relative; flex:none; }
  .mark i { position:absolute; left:5.5px; height:2.5px; border-radius:2px; background:#eceee9; }
  .mark i:nth-child(1){top:4px;width:4px;opacity:.55} .mark i:nth-child(2){top:8px;width:7px;opacity:.8} .mark i:nth-child(3){top:12px;width:11px;background:var(--amber)} .mark i:nth-child(4){top:16px;width:7px;opacity:.8}
  .top h1 { font-size:15px; font-weight:600; margin:0; }
  .controls { position:relative; display:flex; align-items:center; gap:8px; margin-left:8px; }
  .chip { border:1px solid var(--rule2); background:#fff; border-radius:999px; height:32px; padding:0 14px; display:inline-flex; align-items:center; font-size:13px; font-weight:500; color:var(--ink); cursor:pointer; transition:border-color .12s; }
  .chip:hover { border-color:var(--ink); }
  .pop { position:absolute; left:0; top:38px; z-index:40; background:#fff; border:1px solid var(--rule2); border-radius:14px; box-shadow:0 12px 34px rgba(24,28,24,.13); padding:8px; width:290px; display:none; }
  .pop.show { display:block; }
  .pop .ttl { font:11px ui-monospace, Menlo, monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:6px 10px 8px; margin:0; }
  .row2 { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px; cursor:pointer; font-size:14px; min-height:38px; }
  .row2:hover { background:#f1f3ee; }
  .row2 .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row2 small { color:var(--muted); font-size:12px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--rule2); flex:none; }
  .dot.ok { background:var(--ok);} .dot.bad { background:var(--bad);} .dot.live { background:var(--amber); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  .quiet { padding:8px 10px; color:var(--muted); font-size:13px; }
  .sp { flex:1; }
  .wrap { width:100%; margin:0; padding:24px 24px 56px; display:grid; grid-template-columns:minmax(0,1fr); gap:24px; align-items:start; }
  .col-main { max-width:760px; width:100%; margin:0 auto; min-width:0; }
  /* wide screens: the library floats as its own card at the left, detached
     from the window edge; the video centers in the space beside it. */
  @media (min-width: 1000px) {
    .wrap.two { grid-template-columns:272px minmax(0,1fr); gap:32px; }
    .wrap.two .lib { position:sticky; top:24px; order:-1; }
  }

  /* live activity — what an agent is doing to this library right now */
  .live { border:1px solid var(--rule); background:var(--card); border-radius:14px; padding:14px 18px; margin-bottom:18px; display:none; }
  .live.show { display:block; }
  .live .head { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--muted); margin-bottom:6px; }
  .live .head b { color:var(--ink); font-weight:600; }
  .live .lines { font-size:14px; color:var(--muted); }
  .live .lines div { padding:1.5px 0; }
  .live .lines div:last-child { color:var(--ink); }
  /* the video */
  .pin { display:none; }
  .pin.show { display:block; }
  /* The element takes the video's own shape: width follows the height cap, so
     a 1.6:1 take gets no black bars at the sides. */
  .pin video { width:auto; max-width:100%; height:auto; max-height:60vh; margin:0 auto; border-radius:14px; background:#000; display:block; border:1px solid var(--rule2); box-shadow:0 16px 40px rgba(24,28,24,.10); }
  .under { display:flex; align-items:baseline; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .vtitle { font-size:15px; font-weight:600; color:var(--ink); }
  .vmeta { font-size:13px; color:var(--muted); }
  .under a, .under button { color:var(--ink); text-decoration:none; border:1px solid var(--rule2); background:#fff; border-radius:999px; padding:0 14px; cursor:pointer; font-size:13px; font-weight:500; display:inline-flex; align-items:center; transition:border-color .12s; }
  .under a:hover, .under button:hover { border-color:var(--ink); }
  /* A native select with its arrow removed leaves lopsided padding; make it
     sit exactly like the pills beside it, text centred, same height. */
  .under select { color:var(--ink); border:1px solid var(--rule2); background:#fff; border-radius:999px; padding:0 12px; height:32px; font-size:13px; font-weight:500; font-family:inherit; text-align:center; text-align-last:center; cursor:pointer; -webkit-appearance:none; appearance:none; min-width:58px; transition:border-color .12s; }
  .under a, .under button { height:32px; box-sizing:border-box; align-self:center; }
  .under select:hover { border-color:var(--ink); }
  .frames { margin-top:16px; border:1px solid var(--rule); background:var(--card); border-radius:16px; padding:14px 16px; }
  .frames .fhead { display:flex; align-items:center; margin-bottom:10px; }
  .frames .fhead .lab { font:11px ui-monospace, Menlo, monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .frames .fhead .hint { margin-left:10px; font-size:12.5px; color:var(--muted); }
  .stills { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; align-items:center; }
  .stills label.up { font-size:12.5px; font-weight:500; color:var(--muted); border:1px dashed var(--rule2); border-radius:8px; height:58px; display:inline-flex; align-items:center; padding:0 14px; cursor:pointer; flex:none; transition:border-color .12s, color .12s; }
  .stills label.up:hover { border-color:var(--ink); color:var(--ink); }
  .stills img { height:58px; border-radius:8px; border:1px solid var(--rule2); cursor:pointer; flex:none; transition:border-color .12s; }
  .stills img:hover { border-color:var(--ink); }
  .stills img.poster, .coverrow img.poster { border-color:var(--ink); box-shadow:0 0 0 2px var(--ink); }
  .coverrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .coverrow:empty { display:none; margin:0; }
  .coverrow img { height:58px; border-radius:8px; border:1px solid var(--rule2); cursor:pointer; transition:border-color .12s; }
  .coverrow img:hover { border-color:var(--ink); }
  .coverrow .lab { display:none; }
  .coverrow label.up { font-size:12.5px; font-weight:500; color:var(--muted); border:1px dashed var(--rule2); border-radius:8px; height:58px; display:inline-flex; align-items:center; padding:0 14px; cursor:pointer; transition:border-color .12s, color .12s; }
  .coverrow label.up:hover { border-color:var(--ink); color:var(--ink); }
  /* the library: one quiet card at the video's side */
  .lib { border:1px solid var(--rule); background:var(--card); border-radius:16px; padding:12px 8px; position:sticky; top:24px; line-height:1.4; }
  .lib h2 { font:11px ui-monospace, Menlo, monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:500; margin:4px 4px 10px 14px; }
  details.group { margin-bottom:0; }
  details.group summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; padding:0 12px 0 6px; border-radius:10px; font-size:14px; color:var(--muted); height:38px; }
  details.group summary::-webkit-details-marker { display:none; }
  details.group summary:hover { background:#eef1ea; color:var(--ink); }
  details.group summary .tri { transition:transform .15s; font-size:9px; color:var(--rule2); width:18px; height:18px; display:flex; align-items:center; justify-content:center; flex:none; }
  details.group summary:hover .tri { color:var(--muted); }
  /* The folder mark is quiet: amber belongs to the brand and the live dot,
     not to every row of a list. */
  details.group summary .fold { width:15px; height:12px; flex:none; position:relative; opacity:.8; }
  details.group summary .fold::before { content:""; position:absolute; inset:0; border-radius:2.5px; background:var(--rule2); }
  details.group summary .fold::after { content:""; position:absolute; left:0; top:-2.5px; width:7px; height:4px; border-radius:2px 2px 0 0; background:var(--rule2); }
  details.group[open] summary .fold::before, details.group[open] summary .fold::after { background:var(--amber); opacity:.85; }
  details.group[open] summary .tri { transform:rotate(90deg); }
  details.group summary b { color:var(--ink); font-weight:500; font-size:13.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  details.group summary small { margin-left:auto; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  details.group .demo { margin-left:24px; }
  .demo { display:flex; align-items:center; gap:9px; padding:0 10px; border-radius:9px; cursor:pointer; height:34px; }
  .demo:hover { background:#eef1ea; }
  .demo.on { background:#fff; border:1px solid var(--rule); box-shadow:0 1px 3px rgba(24,28,24,.05); }
  .demo .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; }
  .demo small { color:var(--muted); font-size:11.5px; flex:none; font-variant-numeric:tabular-nums; }
  .demo .zap { flex:none; border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:14px; width:26px; height:26px; border-radius:7px; visibility:hidden; }
  .demo .zap:hover { background:#f3e9e6; }
  .demo:hover .zap { visibility:visible; }
  .demo .zap:hover { color:var(--bad); }
  .arch { margin-top:10px; border-top:1px solid var(--rule); padding-top:10px; }
  .arch .row2 small { cursor:pointer; }
  .arch .row2 small:hover { color:var(--ink); text-decoration:underline; }
  .arch .clear { display:block; width:100%; text-align:left; border:0; background:transparent; color:var(--muted); font-size:13px; padding:10px 12px; cursor:pointer; border-radius:10px; }
  .arch .clear:hover { background:#f3e9e6; color:var(--bad); }
  .veil { position:fixed; inset:0; background:rgba(24,28,24,.32); display:flex; align-items:center; justify-content:center; z-index:60; }
  .modal { background:#fff; border:1px solid var(--rule2); border-radius:16px; box-shadow:0 18px 50px rgba(24,28,24,.18); padding:22px 24px; width:min(92vw, 380px); }
  .modal h3 { margin:0 0 8px; font-size:16px; }
  .modal p { margin:0 0 18px; color:var(--muted); font-size:14px; line-height:1.55; }
  .modal .row { display:flex; gap:8px; justify-content:flex-end; }
  .modal .btn { border:1px solid var(--rule2); background:#fff; border-radius:10px; padding:8px 15px; cursor:pointer; font-size:14px; }
  .modal .btn:hover { border-color:var(--ink); }
  .modal .btn.danger { background:var(--bad); border-color:var(--bad); color:#fff; }
  .modal .btn.danger:hover { filter:brightness(.92); }
  .empty { text-align:center; color:var(--muted); padding:60px 20px; }
  .empty .mark { margin:0 auto 14px; width:34px; height:34px; border-radius:10px; }
  .empty .mark i { left:8px; height:3.5px; }
  .empty .mark i:nth-child(1){top:7px;width:7px} .empty .mark i:nth-child(2){top:13px;width:11px} .empty .mark i:nth-child(3){top:19px;width:17px} .empty .mark i:nth-child(4){top:25px;width:11px}
  .empty h2 { color:var(--ink); font-size:17px; margin:0 0 6px; }
  .empty p { margin:0; font-size:14px; }
  .empty code { background:var(--card); border:1px solid var(--rule); border-radius:6px; padding:2px 7px; font:13px ui-monospace, Menlo, monospace; }
  .modal.wide { width:min(94vw, 560px); max-height:82vh; display:flex; flex-direction:column; }
  .modal.wide h3 { display:flex; align-items:baseline; gap:9px; }
  .modal.wide .scroll { overflow-y:auto; margin:0 -4px; padding:0 4px; }
  .rel { border-top:1px solid var(--rule); padding:15px 0; }
  .rel:first-child { border-top:0; padding-top:2px; }
  .relhead { display:flex; flex-wrap:wrap; align-items:baseline; gap:9px; margin-bottom:7px; }
  .relhead b { font-size:14.5px; color:var(--ink); letter-spacing:-.01em; }
  .relmeta { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  /* --accent is near-black in this window; the badge needs the amber token or
     it renders dark ink on a dark pill and reads as a redaction bar. */
  .rel.latest .relmeta::after { content:"newest"; margin-left:7px; padding:1.5px 7px; border-radius:99px; background:var(--amber); color:#241d0c; font-size:10.5px; font-weight:600; letter-spacing:.01em; }
  .rel ul { margin:0; padding-left:17px; }
  .rel li { margin:4px 0; font-size:13.5px; line-height:1.55; color:var(--muted); }
  .rel:not(.latest) li { opacity:.8; }
  .chip .ndot { display:inline-block; width:6px; height:6px; border-radius:99px; background:var(--amber); margin-left:6px; vertical-align:middle; }
  .lib h2 { display:flex; align-items:center; gap:8px; }
  .lib h2 .selbtn { margin-left:auto; border:1px solid var(--rule2); background:#fff; color:var(--muted); border-radius:8px; font-size:11.5px; padding:3px 9px; cursor:pointer; line-height:1.4; }
  .lib h2 .selbtn:hover { border-color:var(--ink); color:var(--ink); }
  .lib h2 .selbtn.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  .demo .pick { display:none; width:15px; height:15px; margin-right:2px; accent-color:var(--ink); flex:none; cursor:pointer; }
  body.selecting .demo .pick { display:inline-block; }
  body.selecting .demo .zap { display:none; }
  body.selecting .demo { cursor:pointer; }
  .selbar { position:sticky; bottom:0; margin-top:10px; padding:10px 12px; background:var(--paper); border-top:1px solid var(--rule2); display:flex; align-items:center; gap:9px; }
  .selbar small { color:var(--muted); font-size:12px; }
  .selbar .sp { flex:1; }
  .selbar button { border:1px solid var(--rule2); background:#fff; border-radius:8px; font-size:12px; padding:5px 11px; cursor:pointer; }
  .selbar button:hover { border-color:var(--ink); }
  .selbar button.go { background:var(--bad); border-color:var(--bad); color:#fff; }
  .selbar button.go:disabled { opacity:.4; cursor:default; }
  .selbar button.go:not(:disabled):hover { filter:brightness(.92); }
  .group summary .gpick { display:none; width:15px; height:15px; margin-right:2px; accent-color:var(--ink); flex:none; cursor:pointer; vertical-align:middle; }
  body.selecting .group summary .gpick { display:inline-block; }
  .arch summary .emptybtn { margin-left:auto; border:1px solid var(--rule2); background:#fff; color:var(--muted); border-radius:8px; font-size:11px; padding:2px 8px; cursor:pointer; }
  .arch summary .emptybtn:hover { background:var(--bad); border-color:var(--bad); color:#fff; }
  .arch summary { display:flex; align-items:center; gap:6px; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="mark"><i></i><i></i><i></i><i></i></div>
    <h1>Retake</h1>
    <span class="sp"></span>
    <a class="chip" href="/guide" style="text-decoration:none">How it works</a>
    <button class="chip" id="newsBtn" title="What changed in this version">What's new</button>
    <button class="chip" id="gremlinBtn" title="Something's off? Tell me.">Bug?</button>
  </div>
  <div class="wrap two">
    <div class="col-main">
    <div class="live" id="live">
      <div class="head"><span class="dot live" id="liveDot"></span><b id="liveWho"></b><span id="liveWhat"></span></div>
      <div class="lines" id="liveLines"></div>
    </div>
    <div class="pin" id="pin">
      <video id="vid" controls playsinline></video>
      <div class="under">
        <span class="vtitle" id="vidName"></span>
        <span class="vmeta" id="vidMeta"></span>
        <span class="sp"></span>
        <select id="vidSpeed" title="Playback speed — preview now, and Download gets this speed">
          <option value="0.75">0.75×</option><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option>
        </select>
        <a id="vidDl" download>Download</a>
        <button id="vidFolder">Show in folder</button>
      </div>
      <div class="frames">
        <div class="fhead">
          <span class="lab">Poster & frames</span>
          <span class="hint">click any frame to make it the poster</span>
          <span class="sp"></span>
          <button class="chip" id="vidCover" title="Make the frame showing right now the poster">Use current frame</button>
        </div>
        <div class="coverrow" id="coverrow"></div>
        <div class="stills" id="stills"></div>
      </div>
    </div>
    <div class="empty" id="empty" style="display:none">
      <div class="mark"><i></i><i></i><i></i><i></i></div>
      <h2>Nothing recorded yet</h2>
      <p>Ask your agent for a demo — <code>record a demo of my app showing the sign-up flow</code> —<br>It will appear here.<br><a href="/guide">How Retake works</a> — one page, two minutes.</p>
    </div>
    </div>
    <aside class="lib" id="lib" style="display:none">
      <h2><span id="libTtl">Library</span><button class="selbtn" id="selBtn" title="Pick several to archive at once">Select</button></h2>
      <div id="demos"></div>
    </aside>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
let current = null, demos = [], settings = null;
async function api(u, o) { const r = await fetch(u, o); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; }

const REPO = 'https://github.com/glebbogachev00/retake';
async function setCover(body, marked) {
  try {
    await api('/api/cover/' + current, { method: 'POST', body: JSON.stringify(body) });
    // Cache-bust: the poster keeps its filename, so the browser needs telling.
    const v = '?v=' + Date.now();
    $('vid').poster = `/out/${current}/thumbnail.png` + v;
    for (const i of document.querySelectorAll('.stills img, .coverrow img')) i.classList.remove('poster');
    if (marked) marked.classList.add('poster');
    const meta = $('vidMeta').textContent;
    $('vidMeta').textContent = meta.replace(/ · poster set$/, '') + ' · poster set';
  } catch (e) { $('vidMeta').textContent = 'could not set the poster: ' + e.message; }
}


// What's new — reads the same list the landing page does. The dot appears when
// the newest entry is one this browser has not seen, and only until it is read;
// nothing interrupts a person who is in the middle of something.
const SEEN_KEY = 'retake:seen-release';
let releases = null;
async function loadReleases() {
  if (releases) return releases;
  try { releases = (await api('/api/releases')).releases || []; } catch { releases = []; }
  return releases;
}
(async () => {
  const rs = await loadReleases();
  const btn = $('newsBtn');
  if (!rs.length) { btn.style.display = 'none'; return; }
  if (localStorage.getItem(SEEN_KEY) !== rs[0].version) btn.insertAdjacentHTML('beforeend', '<span class="ndot"></span>');
})();
$('newsBtn').onclick = async () => {
  const rs = await loadReleases();
  if (!rs.length) return;
  const fmt = (d) => { const x = new Date(d + 'T00:00:00'); return isNaN(x) ? '' : x.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }); };
  const veil = document.createElement('div');
  veil.className = 'veil';
  veil.innerHTML = '<div class="modal wide"><h3>What\'s new</h3>' +
    '<div class="scroll">' + rs.map((r, i) =>
      '<div class="rel' + (i ? '' : ' latest') + '">' +
        '<div class="relhead"><b>' + esc(r.headline) + '</b><span class="relmeta">' + esc(r.version) + (r.date ? ' · ' + fmt(r.date) : '') + '</span></div>' +
        '<ul>' + (r.notes || []).map((n) => '<li>' + esc(n) + '</li>').join('') + '</ul>' +
      '</div>').join('') + '</div>' +
    '<div class="row" style="margin-top:18px"><button class="btn" id="newsClose">Close</button></div></div>';
  document.body.appendChild(veil);
  localStorage.setItem(SEEN_KEY, rs[0].version);
  $('newsBtn').querySelector('.ndot')?.remove();
  const shut = () => veil.remove();
  veil.querySelector('#newsClose').onclick = shut;
  veil.onclick = (e) => { if (e.target === veil) shut(); };
  document.addEventListener('keydown', function esc2(e) { if (e.key === 'Escape') { shut(); document.removeEventListener('keydown', esc2); } });
};

document.getElementById('gremlinBtn').onclick = async () => {
  const veil = document.createElement('div');
  veil.className = 'veil';
  const hasDemo = !!current;
  veil.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="width:min(92vw,440px)">
    <h3>Something off?</h3>
    <p>Say it however it broke. Retake fills in the boring half — version, demo, and what the last take actually did — you just write the sentence.</p>
    <textarea id="gremText" rows="4" placeholder="It was supposed to… but instead…" style="width:100%;border:1px solid var(--rule2);border-radius:10px;padding:10px 12px;font:inherit;resize:vertical;margin-bottom:10px"></textarea>
    <input id="gremContact" type="text" placeholder="Where can I find you? GitHub or X handle — optional" style="width:100%;border:1px solid var(--rule);border-radius:10px;padding:9px 12px;font-size:13.5px;margin-bottom:10px" />
    ${hasDemo ? `<label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:14px"><input type="checkbox" id="gremAttach" checked> Attach the receipts for “${esc(current)}”</label>` : ''}
    <div class="row">
      <button class="btn" data-no>Never mind</button>
      <button class="btn" data-copy>Copy report</button>
      <button class="btn danger" style="background:var(--accent);border-color:var(--accent)" data-go>File it on GitHub</button>
    </div>
    <p style="margin:12px 0 0;font-size:12px">Goes to the public issue tracker — no email involved, mine or yours.</p>
  </div>`;
  const close = () => veil.remove();
  veil.addEventListener('click', (e) => { if (e.target === veil) close(); });
  veil.querySelector('[data-no]').onclick = close;
  const build = async () => {
    const text = veil.querySelector('#gremText').value.trim() || '(they typed nothing — apparently it was self-explanatory)';
    const contact = veil.querySelector('#gremContact').value.trim();
    let boring = `Retake ${settings?.version || 'dev'} · ${navigator.platform}`;
    const attach = veil.querySelector('#gremAttach');
    if (attach && attach.checked && current) {
      try {
        const d = await api('/api/take/' + current);
        const t = d.take;
        boring += `\ndemo: ${current} · ${t.ok ? 'all steps passed' : 'a step FAILED'} · ${(t.duration - t.trimBefore).toFixed(0)}s`;
        const tail = (d.proof || '').split('\n').filter((l) => /\| \d+ \|/.test(l)).slice(-8).join('\n');
        if (tail) boring += '\n\nlast steps of the take:\n' + tail;
      } catch { /* no take, no receipts */ }
    }
    return `**What happened**\n\n${text}\n\n${contact ? `**Where to find them:** ${contact}\n\n` : ''}---\n_The boring half, filled in by Retake:_\n\n\u0060\u0060\u0060\n${boring}\n\u0060\u0060\u0060\n`;
  };
  veil.querySelector('[data-copy]').onclick = async () => {
    await navigator.clipboard.writeText(await build()).catch(() => {});
    veil.querySelector('[data-copy]').textContent = 'Copied';
  };
  veil.querySelector('[data-go]').onclick = async () => {
    const body = await build();
    const title = 'bug: ' + (veil.querySelector('#gremText').value.trim().slice(0, 60) || 'something is off');
    window.open(REPO + '/issues/new?labels=bug&template=bug.md&title=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(body).slice(0, 6500), '_blank');
    close();
  };
  document.body.appendChild(veil);
  setTimeout(() => veil.querySelector('#gremText').focus(), 40);
};

function ask(title, body, confirmLabel) {
  return new Promise((done) => {
    const veil = document.createElement('div');
    veil.className = 'veil';
    veil.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(body)}</p><div class="row"><button class="btn" data-no>Cancel</button><button class="btn danger" data-yes>${esc(confirmLabel)}</button></div></div>`;
    const end = (v) => { veil.remove(); document.removeEventListener('keydown', onKey); done(v); };
    const onKey = (e) => { if (e.key === 'Escape') end(false); };
    veil.addEventListener('click', (e) => { if (e.target === veil) end(false); });
    veil.querySelector('[data-no]').onclick = () => end(false);
    veil.querySelector('[data-yes]').onclick = () => end(true);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(veil);
    setTimeout(() => veil.querySelector('[data-no]').focus(), 40);
  });
}

async function pin(name) {
  let d; try { d = await api('/api/take/' + name); } catch { return false; }
  if (!d.files.includes('demo.mp4')) return false;
  current = name;
  const q = '?v=' + d.stamp;
  const playing = !$('vid').paused && !$('vid').ended;
  if (!$('vid').src.includes('/out/' + name + '/') || !playing) {
    $('vid').src = `/out/${name}/demo.mp4${q}`;
    if (d.files.includes('thumbnail.png')) $('vid').poster = `/out/${name}/thumbnail.png${q}`;
  }
  const t = d.take;
  const failed = (t.timeline || []).find((e) => e.ok === false);
  $('vidName').textContent = name;
  $('vidMeta').textContent = `${(t.duration - t.trimBefore).toFixed(0)}s · ${t.ok ? 'all steps passed' : failed ? `stopped at step ${failed.index}: ${failed.summary}` : 'some steps failed'}${d.facts ? ` · ${d.facts.width}×${d.facts.height}` : ''}`;
  $('vidMeta').title = failed?.screen ? 'On screen at that moment: ' + failed.screen : '';
  $('vidDl').href = `/out/${name}/demo.mp4${q}`; $('vidDl').setAttribute('download', name + '.mp4');
  $('vidFolder').onclick = () => api('/api/open/' + name, { method: 'POST' }).catch(() => {});
$('vidCover').onclick = () => setCover({ at: $('vid').currentTime });
  const tempo = (demos.find((x) => x.name === name)?.settings?.tempo) || 1;
  $('vidSpeed').value = String(tempo);
  $('vid').playbackRate = 1; // the file already carries its tempo
  // The poster is the first thing anyone sees of a video, so it is chosen
  // here, not guessed: any scene still, any frame of the take, a generated
  // cover, or the person's own image. All of it just rewrites thumbnail.png,
  // so it costs no re-render.
  // One tray: generated covers first, then every scene frame, then upload —
  // a single row a person scans once, left to right.
  const st = (d.files || []).filter((f) => f.startsWith('stills/')).sort();
  const covers = (d.files || []).filter((f) => f === 'cover.png' || f === 'cover-titled.png');
  $('coverrow').innerHTML = '';
  $('stills').innerHTML =
    covers.map((f) => `<img src="/out/${name}/${f}${q}" title="${f === 'cover.png' ? 'The title card' : 'This frame, with the title on it'}" data-file="${f}">`).join('') +
    st.map((f) => `<img src="/out/${name}/${f}${q}" title="Make this the poster — ${esc(f.slice(7, -4))}" loading="lazy" data-still="${esc(f.slice(7))}">`).join('') +
    `<label class="up">Upload an image<input type="file" accept="image/png,image/jpeg,image/webp" hidden id="coverUp"></label>`;
  for (const img of $('stills').querySelectorAll('img[data-still]')) img.onclick = () => setCover({ still: img.dataset.still }, img);
  for (const img of $('stills').querySelectorAll('img[data-file]')) img.onclick = () => setCover({ file: img.dataset.file }, img);
  $('coverUp').onchange = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => setCover({ dataUrl: r.result });
    r.readAsDataURL(f);
  };
  $('pin').classList.add('show');
  drawDemos();
  return true;
}

async function drawDemos() {
  try { demos = await api('/api/demos'); } catch { return; }
  demos.sort((a, b) => (b.lastTake ? new Date(b.lastTake.finishedAt).getTime() : 0) - (a.lastTake ? new Date(a.lastTake.finishedAt).getTime() : 0));
  const has = demos.length > 0;
  $('empty').style.display = has ? 'none' : '';
  $('lib').style.display = has ? '' : 'none';
  document.body.classList.toggle('rail', has);
  $('libTtl').textContent = `Library · ${demos.length}`;
  $('demos').innerHTML = '';
  const groups = new Map();
  for (const p of demos) { const g = p.group || 'unsorted'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(p); }
  const open = new Set(JSON.parse(localStorage.getItem('retake.openGroups') || 'null') || [demos.find((d) => d.name === current)?.group || (demos[0] && demos[0].group)]);
  for (const [g, items] of groups) {
    const det = document.createElement('details');
    det.className = 'group';
    const holdsCurrent = items.some((x) => x.name === current);
    if (open.has(g) || groups.size === 1 || holdsCurrent) det.open = true;
    det.innerHTML = `<summary><input type="checkbox" class="gpick"><span class="tri">▶</span><span class="fold" aria-hidden="true"></span><b>${esc(g)}</b><small>${items.length}</small></summary>`;
    // A whole folder in one click — with 35 demos in a handful of projects,
    // ticking them one at a time is the thing this is meant to replace.
    const gbox = det.querySelector('.gpick');
    const names = items.map((x) => x.name);
    gbox.checked = names.length > 0 && names.every((n) => picked.has(n));
    // Clicking a checkbox inside <summary> also toggles the folder open/shut,
    // and preventDefault would stop BOTH — including the tick, which is what
    // makes "select the folder" look like it did nothing. So the fold is
    // allowed to happen and then put straight back, and the tick is left
    // entirely alone.
    gbox.onclick = (ev) => {
      ev.stopPropagation();
      const wasOpen = det.open;
      const all = names.every((n) => picked.has(n));
      for (const n of names) all ? picked.delete(n) : picked.add(n);
      for (const b of det.querySelectorAll('.demo .pick')) b.checked = !all;
      drawSelBar();
      setTimeout(() => { det.open = wasOpen; }, 0);
    };
    det.addEventListener('toggle', () => {
      const now = [...document.querySelectorAll('details.group[open] summary b')].map((b) => b.textContent);
      localStorage.setItem('retake.openGroups', JSON.stringify(now));
    });
    for (const p of items) {
      const el = document.createElement('div');
      el.className = 'demo' + (p.name === current ? ' on' : '');
      const dot = p.lastTake ? (p.lastTake.ok && !p.lastTake.partial ? 'ok' : 'bad') : '';
      const when = p.lastTake ? new Date(p.lastTake.finishedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : 'no take yet';
      el.innerHTML = `<input type="checkbox" class="pick"${picked.has(p.name) ? ' checked' : ''}><span class="dot ${dot}"></span><span class="nm">${esc(p.name)}</span><small>${esc(when)}</small><button class="zap" title="Archive this demo">✕</button>`;
      const box = el.querySelector('.pick');
      const syncGroup = () => { const gb = det.querySelector('.gpick'); if (gb) gb.checked = items.every((x) => picked.has(x.name)); };
      box.onclick = (ev) => { ev.stopPropagation(); box.checked ? picked.add(p.name) : picked.delete(p.name); syncGroup(); drawSelBar(); };
      el.onclick = () => {
        // In select mode the whole row is the checkbox — hunting for a 15px
        // target is exactly the fiddliness this is meant to remove.
        if (selecting) { box.checked = !box.checked; box.checked ? picked.add(p.name) : picked.delete(p.name); syncGroup(); drawSelBar(); return; }
        if (p.lastTake) pin(p.name);
      };
      el.querySelector('.zap').onclick = async (ev) => {
        ev.stopPropagation();
        // Archive, not destroy — but moving someone's work still deserves a beat.
        if (!(await ask('Archive ' + p.name + '?', 'Its videos are removed. The demo itself moves to the archive below and can be restored any time.', 'Archive'))) return;
        await api('/api/demos/' + p.name, { method: 'DELETE' }).catch((e) => alert(e.message));
        if (current === p.name) { current = null; $('pin').classList.remove('show'); }
        await drawDemos();
      };
      det.appendChild(el);
    }
    $('demos').appendChild(det);
  }
  await drawArchive();
  drawSelBar();
}


// Bulk archive. Off by default: a list you can accidentally multi-select from
// is worse than one that needs a deliberate "Select" first.
let selecting = false;
const picked = new Set();

function drawSelBar() {
  const old = document.querySelector('.selbar'); if (old) old.remove();
  if (!selecting) return;
  const bar = document.createElement('div');
  bar.className = 'selbar';
  const n = picked.size;
  bar.innerHTML = `<small>${n ? n + ' selected' : 'none selected'}</small><span class="sp"></span>` +
    `<button id="selAll">${n === demos.length ? 'None' : 'All'}</button>` +
    `<button class="go" id="selGo"${n ? '' : ' disabled'}>Archive${n ? ' ' + n : ''}</button>`;
  $('lib').appendChild(bar);
  bar.querySelector('#selAll').onclick = () => {
    if (picked.size === demos.length) picked.clear(); else for (const d of demos) picked.add(d.name);
    for (const b of document.querySelectorAll('.demo .pick')) b.checked = picked.has(b.parentElement.querySelector('.nm').textContent);
    drawSelBar();
  };
  bar.querySelector('#selGo').onclick = async () => {
    const names = [...picked];
    if (!names.length) return;
    if (!(await ask(`Archive ${names.length} demo${names.length === 1 ? '' : 's'}?`,
      names.slice(0, 8).join(', ') + (names.length > 8 ? ` and ${names.length - 8} more` : '') +
      '. Their videos are removed. The demos move to the archive below and can be restored any time.', 'Archive'))) return;
    const failed = [];
    for (const nm of names) {
      try { await api('/api/demos/' + nm, { method: 'DELETE' }); } catch (e) { failed.push(nm + ' (' + e.message + ')'); }
    }
    if (current && picked.has(current)) { current = null; $('pin').classList.remove('show'); }
    picked.clear();
    selecting = false;
    document.body.classList.remove('selecting');
    $('selBtn').classList.remove('on');
    await drawDemos();
    if (failed.length) alert('Could not archive:\n' + failed.join('\n'));
  };
}

$('selBtn').onclick = () => {
  selecting = !selecting;
  picked.clear();
  document.body.classList.toggle('selecting', selecting);
  $('selBtn').classList.toggle('on', selecting);
  $('selBtn').textContent = selecting ? 'Done' : 'Select';
  drawDemos();
};

async function drawArchive() {
  let items = [];
  try { items = await api('/api/trash'); } catch { return; }
  const old = document.querySelector('.arch'); if (old) old.remove();
  if (!items.length) return;
  const det = document.createElement('details');
  det.className = 'group arch';
  det.innerHTML = `<summary><span class="tri">▶</span><b>Archive</b><small>${items.length}</small><button class="emptybtn" id="emptyArch" title="Delete every archived demo, permanently">Empty</button></summary>`;
  for (const t of items) {
    const el = document.createElement('div');
    el.className = 'row2';
    el.innerHTML = `<span class="dot"></span><span class="nm" style="color:var(--muted)">${esc(t.name)}</span><small>restore</small>`;
    el.querySelector('small').onclick = async (ev) => { ev.stopPropagation(); await api('/api/demos/' + t.name + '/restore', { method: 'POST' }).catch((e) => alert(e.message)); await drawDemos(); };
    det.appendChild(el);
  }
  const clear = document.createElement('button');
  clear.className = 'clear';
  clear.textContent = `Empty the archive — delete ${items.length} demo${items.length === 1 ? '' : 's'} for good`;
  const empty = async (ev) => {
    if (ev) { ev.stopPropagation(); ev.preventDefault(); }   // the summary must not fold
    if (!(await ask('Empty the archive?', `${items.length} archived demo${items.length === 1 ? '' : 's'} will be deleted permanently — the manifests and everything recorded from them. There is no way back from this one.`, 'Delete forever'))) return;
    await api('/api/trash/clear', { method: 'POST' });
    await drawDemos();
  };
  clear.onclick = empty;
  det.querySelector('#emptyArch').onclick = empty;
  det.appendChild(clear);
  $('demos').appendChild(det);
}

async function newest() {
  const withTake = demos.filter((x) => x.lastTake).sort((a, b) => new Date(b.lastTake.finishedAt) - new Date(a.lastTake.finishedAt));
  for (const d of withTake) if (await pin(d.name)) return;
}

// ---- speed: hear it now, keep it on download ----------------------------------
$('vidSpeed').addEventListener('change', async () => {
  if (!current) return;
  const v = Number($('vidSpeed').value);
  const was = (demos.find((x) => x.name === current)?.settings?.tempo) || 1;
  // Preview instantly: the current file plays at (wanted / baked) rate.
  $('vid').playbackRate = v / was;
  $('vidMeta').textContent = `${current} · re-rendering at ${v}× — Download will have it in a few seconds…`;
  try {
    await api('/api/demos/' + current + '/settings', { method: 'PATCH', body: JSON.stringify({ tempo: v === 1 ? null : v }) });
    const before = (await api('/api/take/' + current)).stamp;
    await api('/api/run/' + current + '?mode=render', { method: 'POST' });
    for (let i = 0; i < 60; i++) {
      await new Promise((r) => setTimeout(r, 1500));
      const d = await api('/api/take/' + current).catch(() => null);
      if (d && d.stamp !== before) break;
    }
    await drawDemos();
    await pin(current);
  } catch (e) { $('vidMeta').textContent = `${current} · could not re-render: ${e.message}`; }
});

// ---- secrets: the agent asks by name; the value goes to .env, never to it ----
const secretOpen = new Set();
function askSecrets(r) {
  if (!r || secretOpen.has(r.id)) return;
  secretOpen.add(r.id);
  const isSecret = (n) => /PASS|SECRET|TOKEN|KEY|PIN|OTP/.test(n);
  const veil = document.createElement('div');
  veil.className = 'veil';
  veil.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="width:min(92vw,460px)">
    <h3>Your agent needs a sign-in</h3>
    <p>${esc(r.why || 'The demo starts behind a login.')}</p>
    <p style="font-size:13px;color:var(--muted)"><b>This stays on your computer.</b> What you type is written to one local file — <code>${esc(settings?.envPath || '.env')}</code>, readable by you only — so Retake can sign in during recording. It is not sent to the agent, to any server, or to us; the agent only learns that the names are set. Use a <b>demo account</b>: the result is a video.</p>
    <form id="secForm" autocomplete="off">
      ${r.names.map((n) => `<label style="display:block;margin:10px 0 4px;font-size:12.5px;letter-spacing:.04em;color:var(--muted)">${esc(n)}</label>
        <input name="${esc(n)}" type="${isSecret(n) ? 'password' : 'text'}" autocomplete="${isSecret(n) ? 'new-password' : 'off'}" style="width:100%;border:1px solid var(--rule2);border-radius:10px;padding:10px 12px;font:inherit" />`).join('')}
      <div class="row" style="margin-top:16px">
        <button class="btn" type="button" data-no>Not now</button>
        <button class="btn" type="submit" style="background:var(--accent);border-color:var(--accent);color:#fff">Save to .env</button>
      </div>
    </form>
  </div>`;
  const close = () => { veil.remove(); secretOpen.delete(r.id); };
  veil.querySelector('[data-no]').onclick = close;
  veil.querySelector('#secForm').onsubmit = async (e) => {
    e.preventDefault();
    const values = {};
    for (const n of r.names) { const v = veil.querySelector(`input[name="${n}"]`).value; if (v.trim()) values[n] = v; }
    if (!Object.keys(values).length) return;
    try { await api('/api/secrets/fill', { method: 'POST', body: JSON.stringify({ id: r.id, values }) }); close(); }
    catch (err) { veil.querySelector('h3').textContent = 'Could not save: ' + err.message; }
  };
  document.body.appendChild(veil);
  setTimeout(() => veil.querySelector('input')?.focus(), 40);
}

// ---- the live feed: an agent working shows up here as it works -------------
function watchActivity() {
  const es = new EventSource('/api/activity/stream');
  const apply = (a) => {
    if (!a || (!a.active && !a.lines?.length)) return;
    $('live').classList.add('show');
    $('liveDot').className = 'dot ' + (a.active ? 'live' : 'ok');
    $('liveWho').textContent = a.active ? (a.who || 'your agent') : 'Done';
    $('liveWhat').textContent = a.demo ? `· ${a.demo}` : '';
    $('liveLines').innerHTML = (a.lines || []).slice(-4).map((l) => `<div>${esc(l)}</div>`).join('');
  };
  es.addEventListener('state', (ev) => {
    const d = JSON.parse(ev.data);
    // The server restarted under us → this page's HTML/CSS is stale. Reload.
    if (window.__boot && d.boot && d.boot !== window.__boot) location.reload();
    window.__boot = d.boot || window.__boot;
    apply(d);
    for (const r of d.secrets || []) askSecrets(r);
  });
  es.addEventListener('line', (ev) => apply(JSON.parse(ev.data)));
  es.addEventListener('secrets', (ev) => askSecrets(JSON.parse(ev.data)));
  es.addEventListener('finished', async (ev) => { apply(JSON.parse(ev.data)); await drawDemos(); await newest(); setTimeout(() => $('live').classList.remove('show'), 8000); });
  es.onerror = () => { es.close(); setTimeout(watchActivity, 3000); };
}

(async () => { settings = await api('/api/settings').catch(() => null); await drawDemos(); await newest(); watchActivity(); setInterval(drawDemos, 30000); })();
</script>
</body>
