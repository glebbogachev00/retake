<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Retake</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#edefe8" />
<style>
  /* The review surface. Retake is driven from an agent (or the workshop);
     this page is where a person watches, judges, and collects the output.
     It accepts no prose on purpose. */
  :root { --paper:#edefe8; --card:#f8f9f5; --ink:#191d19; --muted:#767e74; --rule:#dbdfd3; --rule2:#c9cec0; --accent:#1a1c1e; --amber:#e8b04b; --ok:#2f5d3f; --bad:#a23b2c; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink); font:15px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Inter, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  button, input { font:inherit; color:inherit; }
  .app { min-height:100%; display:flex; flex-direction:column; }
  .top { display:flex; align-items:center; gap:10px; padding:14px 22px; }
  .mark { width:22px; height:22px; border-radius:7px; background:var(--accent); position:relative; flex:none; }
  .mark i { position:absolute; left:5.5px; height:2.5px; border-radius:2px; background:#eceee9; }
  .mark i:nth-child(1){top:4px;width:4px;opacity:.55} .mark i:nth-child(2){top:8px;width:7px;opacity:.8} .mark i:nth-child(3){top:12px;width:11px;background:var(--amber)} .mark i:nth-child(4){top:16px;width:7px;opacity:.8}
  .top h1 { font-size:15px; font-weight:600; margin:0; }
  .controls { position:relative; display:flex; align-items:center; gap:8px; margin-left:8px; }
  .chip { border:1px solid var(--rule); background:transparent; border-radius:999px; padding:5px 11px; font-size:13px; color:var(--muted); cursor:pointer; }
  .chip:hover { border-color:var(--rule2); color:var(--ink); background:var(--card); }
  .pop { position:absolute; left:0; top:38px; z-index:40; background:#fff; border:1px solid var(--rule2); border-radius:14px; box-shadow:0 12px 34px rgba(24,28,24,.13); padding:8px; width:290px; display:none; }
  .pop.show { display:block; }
  .pop .ttl { font:11px ui-monospace, Menlo, monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:6px 10px 8px; margin:0; }
  .row2 { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:9px; cursor:pointer; font-size:14px; }
  .row2:hover { background:#f1f3ee; }
  .row2 .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row2 small { color:var(--muted); font-size:12px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--rule2); flex:none; }
  .dot.ok { background:var(--ok);} .dot.bad { background:var(--bad);} .dot.live { background:var(--amber); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  .quiet { padding:8px 10px; color:var(--muted); font-size:13px; }
  .sp { flex:1; }
  .wrap { max-width:760px; width:100%; margin:0 auto; padding:6px 22px 40px; }
  /* live activity — what an agent is doing to this library right now */
  .live { border:1px solid var(--rule); background:var(--card); border-radius:14px; padding:14px 18px; margin-bottom:18px; display:none; }
  .live.show { display:block; }
  .live .head { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--muted); margin-bottom:6px; }
  .live .head b { color:var(--ink); font-weight:600; }
  .live .lines { font-size:14px; color:var(--muted); }
  .live .lines div { padding:1.5px 0; }
  .live .lines div:last-child { color:var(--ink); }
  /* the video */
  .pin { display:none; }
  .pin.show { display:block; }
  .pin video { width:100%; max-height:52vh; border-radius:12px; background:#000; display:block; }
  .under { display:flex; align-items:center; gap:14px; margin-top:9px; font-size:13px; color:var(--muted); flex-wrap:wrap; }
  .under a, .under button { color:var(--muted); text-decoration:none; border:0; background:transparent; cursor:pointer; padding:0; font-size:13px; }
  .under a:hover, .under button:hover { color:var(--ink); }
  .stills { display:flex; gap:8px; margin-top:10px; overflow-x:auto; padding-bottom:4px; }
  .stills img { height:64px; border-radius:7px; border:1px solid var(--rule); cursor:pointer; flex:none; }
  .stills img:hover { border-color:var(--ink); }
  /* the library */
  .lib { margin-top:26px; }
  .lib h2 { font:11px ui-monospace, Menlo, monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:500; margin:0 0 8px 2px; }
  .demo { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:11px; cursor:pointer; }
  .demo:hover { background:#eef1ea; }
  .demo.on { background:var(--card); border:1px solid var(--rule); }
  .demo .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14.5px; }
  .demo small { color:var(--muted); font-size:12.5px; flex:none; }
  .empty { text-align:center; color:var(--muted); padding:60px 20px; }
  .empty .mark { margin:0 auto 14px; width:34px; height:34px; border-radius:10px; }
  .empty .mark i { left:8px; height:3.5px; }
  .empty .mark i:nth-child(1){top:7px;width:7px} .empty .mark i:nth-child(2){top:13px;width:11px} .empty .mark i:nth-child(3){top:19px;width:17px} .empty .mark i:nth-child(4){top:25px;width:11px}
  .empty h2 { color:var(--ink); font-size:17px; margin:0 0 6px; }
  .empty p { margin:0; font-size:14px; }
  .empty code { background:var(--card); border:1px solid var(--rule); border-radius:6px; padding:2px 7px; font:13px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="mark"><i></i><i></i><i></i><i></i></div>
    <h1>Retake</h1>
    <div class="controls">
      <button class="chip" id="setBtn"><span id="modelTag">…</span></button>
      <button class="chip" onclick="location.href='/classic'">Workshop</button>
      <div class="pop" id="setPop">
        <p class="ttl">Who does the thinking</p>
        <div id="provs"></div>
      </div>
    </div>
    <span class="sp"></span>
  </div>
  <div class="wrap">
    <div class="live" id="live">
      <div class="head"><span class="dot live" id="liveDot"></span><b id="liveWho"></b><span id="liveWhat"></span></div>
      <div class="lines" id="liveLines"></div>
    </div>
    <div class="pin" id="pin">
      <video id="vid" controls playsinline></video>
      <div class="under">
        <span id="vidMeta"></span>
        <span class="sp"></span>
        <a id="vidDl" download>Download</a>
        <button id="vidFolder">Show in Finder</button>
      </div>
      <div class="stills" id="stills"></div>
    </div>
    <div class="empty" id="empty" style="display:none">
      <div class="mark"><i></i><i></i><i></i><i></i></div>
      <h2>Nothing recorded yet</h2>
      <p>Ask your agent for a demo — <code>record a demo of my app showing the sign-up flow</code> —<br>or build one by hand in the <a href="/classic">workshop</a>. It will appear here.</p>
    </div>
    <div class="lib" id="lib" style="display:none">
      <h2 id="libTtl">Demos</h2>
      <div id="demos"></div>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
let current = null, demos = [];
async function api(u, o) { const r = await fetch(u, o); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; }

async function pin(name) {
  let d; try { d = await api('/api/take/' + name); } catch { return false; }
  if (!d.files.includes('demo.mp4')) return false;
  current = name;
  const q = '?v=' + d.stamp;
  const playing = !$('vid').paused && !$('vid').ended;
  if (!$('vid').src.includes('/out/' + name + '/') || !playing) {
    $('vid').src = `/out/${name}/demo.mp4${q}`;
    if (d.files.includes('thumbnail.png')) $('vid').poster = `/out/${name}/thumbnail.png${q}`;
  }
  const t = d.take;
  $('vidMeta').textContent = `${name} · ${(t.duration - t.trimBefore).toFixed(0)}s · ${t.ok ? 'all steps passed' : 'some steps failed'}${d.facts ? ` · ${d.facts.width}×${d.facts.height}` : ''}`;
  $('vidDl').href = `/out/${name}/demo.mp4${q}`; $('vidDl').setAttribute('download', name + '.mp4');
  $('vidFolder').onclick = () => api('/api/open/' + name, { method: 'POST' }).catch(() => {});
  const st = (d.files || []).filter((f) => f.startsWith('stills/')).sort();
  $('stills').innerHTML = st.map((f) => `<img src="/out/${name}/${f}${q}" title="${esc(f.slice(7, -4))}" loading="lazy">`).join('');
  for (const img of $('stills').querySelectorAll('img')) img.onclick = () => window.open(img.src, '_blank');
  $('pin').classList.add('show');
  drawDemos();
  return true;
}

async function drawDemos() {
  try { demos = await api('/api/demos'); } catch { return; }
  const has = demos.length > 0;
  $('empty').style.display = has ? 'none' : '';
  $('lib').style.display = has ? '' : 'none';
  $('libTtl').textContent = `Demos · ${demos.length}`;
  $('demos').innerHTML = '';
  for (const p of demos) {
    const el = document.createElement('div');
    el.className = 'demo' + (p.name === current ? ' on' : '');
    const dot = p.lastTake ? (p.lastTake.ok && !p.lastTake.partial ? 'ok' : 'bad') : '';
    const when = p.lastTake ? new Date(p.lastTake.finishedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : 'no take yet';
    el.innerHTML = `<span class="dot ${dot}"></span><span class="nm">${esc(p.name)}</span><small>${esc(when)}</small>`;
    el.onclick = () => pin(p.name);
    $('demos').appendChild(el);
  }
}

async function newest() {
  const withTake = demos.filter((x) => x.lastTake).sort((a, b) => new Date(b.lastTake.finishedAt) - new Date(a.lastTake.finishedAt));
  for (const d of withTake) if (await pin(d.name)) return;
}

// ---- the live feed: an agent working shows up here as it works -------------
function watchActivity() {
  const es = new EventSource('/api/activity/stream');
  const apply = (a) => {
    if (!a || (!a.active && !a.lines?.length)) return;
    $('live').classList.add('show');
    $('liveDot').className = 'dot ' + (a.active ? 'live' : 'ok');
    $('liveWho').textContent = a.active ? (a.who || 'your agent') : 'Done';
    $('liveWhat').textContent = a.demo ? `· ${a.demo}` : '';
    $('liveLines').innerHTML = (a.lines || []).slice(-4).map((l) => `<div>${esc(l)}</div>`).join('');
  };
  es.addEventListener('state', (ev) => apply(JSON.parse(ev.data)));
  es.addEventListener('line', (ev) => apply(JSON.parse(ev.data)));
  es.addEventListener('finished', async (ev) => { apply(JSON.parse(ev.data)); await drawDemos(); await newest(); setTimeout(() => $('live').classList.remove('show'), 8000); });
  es.onerror = () => { es.close(); setTimeout(watchActivity, 3000); };
}

// ---- settings: just the provider ------------------------------------------
const LABEL = { 'claude-code': 'Claude Code', codex: 'Codex', groq: 'Groq', mistral: 'Mistral', local: 'Local model' };
$('setBtn').onclick = (e) => { e.stopPropagation(); $('setPop').classList.toggle('show'); };
document.addEventListener('click', (e) => { if (!e.target.closest('.pop')) $('setPop').classList.remove('show'); });
async function drawSettings() {
  let st; try { st = await api('/api/settings'); } catch { return; }
  const ready = st.available || [];
  const chosen = st.model || (st.active || '').split(' · ')[0];
  $('modelTag').textContent = ready.length ? (LABEL[chosen] || chosen || 'Pick a model') : 'No model';
  $('provs').innerHTML = ready.length ? '' : '<div class="quiet">Sign in to the <code>claude</code> or <code>codex</code> CLI, or add a key in the workshop.</div>';
  for (const name of ready) {
    const el = document.createElement('div');
    el.className = 'row2';
    el.innerHTML = `<span class="dot ok"></span><span class="nm">${esc(LABEL[name] || name)}</span><small>${chosen === name ? 'in use' : ''}</small>`;
    el.onclick = async () => { await api('/api/settings', { method: 'POST', body: JSON.stringify({ model: name }) }).catch(() => {}); await drawSettings(); $('setPop').classList.remove('show'); };
    $('provs').appendChild(el);
  }
}

(async () => { await drawSettings(); await drawDemos(); await newest(); watchActivity(); setInterval(drawDemos, 30000); })();
</script>
</body>
</html>
