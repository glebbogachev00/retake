name: ci
on:
  push:
    branches: [main, chat, canvas]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    # Retake keeps its browser in its own folder unless this is set; pinning it
    # here keeps the install, the cache below and the tests on one folder.
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Twenty tests drive a real browser, and CI never installed one. Every
      # run on main since the suite gained them has been red at this step,
      # which meant the build, package and init gates below never ran at all.
      - name: cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Retake's whole second half is ffmpeg. The runner does not ship it, so
      # everything that renders was quietly skipping here.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run typecheck
      - run: npm test
      # The landing page has its own checks: static ones, and one that drives
      # the real page in a browser against the local preview server.
      - name: the landing page works in a real browser
        run: |
          npm run site:dev &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4387/ >/dev/null && break; sleep 1; done
          npm run site:test
          npm run site:test:browser
      - run: npm run build
      # A fresh install now starts empty and hands the first manifest to the
      # onboarding operator. Package the agent contract and the voice previews
      # that onboarding promises instead of an obsolete starter manifest.
      - name: the package contains what it promises
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for f in skill/SKILL.md AGENTS.md assets/voice-samples/aiden.mp4 assets/voice-samples/edge.mp4 assets/voice-samples/kokoro.mp4; do
            grep -q "$f" /tmp/pack.txt || { echo "missing from the tarball: $f"; exit 1; }
          done
          ! grep -q "demos/example.yaml" /tmp/pack.txt
      - name: retake init leaves a workspace ready for onboarding
        run: |
          d=$(mktemp -d); cd "$d"
          node "$GITHUB_WORKSPACE/dist/cli.js" init
          test -d demos
          test -d outputs
          test ! -e demos/example.yaml
