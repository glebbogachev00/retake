name: zoom-probe
title: "Regression: typing lands under CSS zoom (needs the AvexJets app on :3200)"
url: http://localhost:3200/#/request
preset: draft
viewport: { width: 1200, height: 900 }
scale: 2.5
reducedMotion: true
camera: static
setup:
  - { action: waitFor, selector: "#f-name" }
  - { action: wait, ms: 800 }
steps:
  - { action: scene, label: form, caption: "probe" }
  - { action: scroll, to: "#f-name", align: center, pauseAfter: 600 }
  - { action: type, selector: "#f-name", text: "Nguyen Minh Anh", delay: 20 }
  - { action: type, selector: "#f-email", text: "minh@example.com", delay: 20 }
  - { action: type, selector: "#f-phone", text: "+84 90 123 4567", delay: 20 }
  - action: evaluate
    script: |
      const v = ['f-name','f-email','f-phone'].map(i => document.getElementById(i).value);
      if (v.some(x => !x)) throw new Error('typing did not land: ' + JSON.stringify(v));
      document.title = v.join(' / ');
  - { action: scene, label: typed, caption: "after typing" }
  - { action: wait, ms: 800 }
