# The pilot lesson: a child's first script, built by dragging.
# Blockly intercepts pointer events on its toolbox and blocks, so every target
# here is a POINT (resolved from the page's own rect), not a locator.
name: scratch-first-script
title: Scratch — make the cat move when you click the flag
url: https://scratch.mit.edu/projects/editor/
preset: post-landscape
viewport: { width: 1440, height: 900 }
scale: 1
waitForSelector: ".blocklyFlyout text"
camera: static
setup:
  - { action: waitFor, selector: "[class*='green-flag_green-flag-button']", timeout: 60000 }
  - { action: wait, ms: 2000 }
steps:
  - action: scene
    label: start
    caption: A script starts with when — when something happens
    camera: static
  - action: wait
    ms: 1600
  - action: click
    at: { selector: "#events" }
    pauseAfter: 1600
  - action: scene
    label: hat
    caption: Drag the hat block into the empty space
    camera: static
  - action: drag
    from: { selector: ".blocklyFlyout text:has-text('when') >> nth=0" }
    to: { x: 600, y: 250 }
    durationMs: 1100
    pauseAfter: 1000
  - action: scene
    label: motion
    caption: Now something for it to do
    camera: static
  - action: click
    at: { selector: "#motion" }
    pauseAfter: 1600
  - action: drag
    from: { selector: ".blocklyFlyout text:has-text('move') >> nth=0" }
    to: { x: 616, y: 306 }
    durationMs: 1100
    pauseAfter: 1200
  - action: scene
    label: snapped
    caption: It snaps underneath — that is the script
    camera: static
  - action: wait
    ms: 1600
  - action: click
    at: { selector: "[class*='green-flag_green-flag-button']" }
    pauseAfter: 1600
  - action: scene
    label: runs
    caption: Click the flag. The cat moves.
    camera: static
  - action: wait
    ms: 2600
outputs:
  mp4: true
  gif: false
  thumbnail:
    scene: runs
