# Regression for the three waits that a bare selector gets wrong.
name: wait-probe
title: "wait probe — gone, stable, minChars"
url: file://../test/fixtures/streaming.html
preset: draft
reducedMotion: true
steps:
  - { action: scene, label: start, caption: "before" }
  - { action: click, selector: "#go" }
  # 1. the previous run's banner is still on screen: wait for it to LEAVE
  - { action: waitFor, selector: "#stale", gone: true, timeout: 8000 }
  # 2. the reply is a shell that streams: wait for it to hold real text
  - { action: waitFor, selector: "#reply", minChars: 40, timeout: 15000 }
  # 3. and to stop changing
  - { action: waitFor, selector: "#reply", stableMs: 500, timeout: 15000 }
  - action: evaluate
    script: |
      const t = document.getElementById('reply').textContent.trim();
      if (document.getElementById('stale')) throw new Error('stale banner still present');
      if (!t.endsWith('complete')) throw new Error('stream not finished: ' + JSON.stringify(t.slice(-40)));
  - { action: scene, label: done, caption: "after" }
  - { action: wait, ms: 2200 }
