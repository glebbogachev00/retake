# Regression for the cursor cap: 100 clicks = 100 cursor moves in one take.
# Before the flat-expression patch the overlay vanished past ~45 moves.
name: cursor-hundred
title: "A hundred cursor moves in one take"
url: file://../test/fixtures/grid.html   # relative to this manifest
preset: draft
reducedMotion: true
camera: static
# idle fade on (the default) — the old cap forced it off past 60 steps
maxSeconds: 600
steps:
  - { action: scene, label: start, caption: "A hundred buttons." }
  - { action: waitFor, selector: "#b100" }
