# TechBash's launch cut: a whole small Scratch project, built by dragging.
#
# Not "two blocks snap together" — a project a child would be proud of: the
# cat turns, changes costume and greets you. Four drags, one flag click, and
# a payoff you can read in a thumbnail: the script glowing, the speech
# bubble up, the sprite mid-stride.
#
# A fifth block (change colour effect) is deliberately absent. It is grabbed
# far from its left edge and would not reach the connector reliably; two
# takes went to proving that. Four blocks that always connect beat five that
# sometimes do.
#
# No C-blocks. A `forever` loop looked better on paper and the first take
# proved why not: blocks dropped near its mouth snapped to each other
# OUTSIDE the loop, so the program was three orphans and an empty loop that
# does nothing. A flat stack under the hat is what Blockly snaps reliably.
#
# Blockly intercepts pointer events on its toolbox and its blocks, so every
# target here is a POINT resolved from the page's own rect, never a locator
# (see docs/canvas-plan.md). Drop coordinates are absolute in the workspace:
# blocks snap to whatever is within ~40px, so each one aims just under the
# previous block's bottom edge.
#
# LAUNCH MODE: it moves. No caption narrates a visible drag — the captions
# name the lesson and the payoff, and nothing else.

mode: launch
name: scratch-mini-project
title: "Scratch — a first project that actually runs"
url: https://scratch.mit.edu/projects/editor/
preset: post-landscape
viewport: { width: 1440, height: 900 }
scale: 1
waitForSelector: ".blocklyFlyout text"
camera: static
compressIdle: true

intro: { title: "TechBash", subtitle: "A first Scratch project, built block by block", ms: 1800 }
outro: { title: "TechBash", subtitle: "bash.techtutor.academy", ms: 1700 }

setup:
  - { action: waitFor, selector: "[class*='green-flag_green-flag-button']", timeout: 60000 }
  - { action: wait, ms: 2500 }

steps:
  - action: scene
    label: empty
    caption: "An empty project, and a plan."
    camera: static
  - action: wait
    ms: 900

  # Every block after the hat is dropped at the SAME point, just under the
  # hat's bottom connector. Blockly inserts there and pushes the rest down,
  # so the stack cannot come apart — which stepping down by a fixed 56px
  # could not promise, because block heights vary (a `say` with two inputs is
  # taller than `next costume`, so the next drop missed the connection and
  # the take came back as four orphans). The script therefore reads in the
  # reverse of the drop order, which no viewer can tell and no child minds.
  - { action: click, at: { selector: "#events" }, pauseAfter: 700 }
  - action: drag
    from: { selector: ".blocklyFlyout text:has-text('when') >> nth=0" }
    to: { x: 620, y: 210 }
    durationMs: 650
    pauseAfter: 350

  # Looks, three in a row: it speaks, it changes costume, it changes colour.
  - { action: click, at: { selector: "#looks" }, pauseAfter: 700 }
  - action: drag
    from: { selector: ".blocklyFlyout text:has-text('say') >> nth=0" }
    to: { x: 620, y: 252 }
    durationMs: 650
    pauseAfter: 350
  - action: drag
    from: { selector: ".blocklyFlyout text:has-text('next costume') >> nth=0" }
    to: { x: 620, y: 252 }
    durationMs: 650
    pauseAfter: 350
  # And one turn, so the sprite moves as well as talks.
  - { action: click, at: { selector: "#motion" }, pauseAfter: 700 }
  - action: drag
    from: { selector: ".blocklyFlyout text:has-text('turn') >> nth=0" }
    to: { x: 620, y: 252 }
    durationMs: 650
    pauseAfter: 500

  - action: scene
    label: built
    caption: "Four blocks, one script."
    camera: static
  - action: wait
    ms: 900

  - { action: click, at: { selector: "[class*='green-flag_green-flag-button']" }, pauseAfter: 700 }
  - action: scene
    label: runs
    caption: "The cat says hello."
    camera: static
  # The bubble lasts two seconds, so the scene is shorter than that — the
  # thumbnail is taken mid-scene and has to land while it is still up.
  - action: wait
    ms: 1900

outputs:
  mp4: true
  thumbnail: { scene: runs }
