# Public-safe: Playwright's hosted TodoMVC. This is the demo the landing
# page ships — a stranger's app, so a stranger can see themselves in it.
name: todo-basics
title: A todo, from typed to done
url: https://demo.playwright.dev/todomvc
preset: post-landscape
waitForSelector: input.new-todo
camera: static
setup:
  # the host page carries a yellow "just a demo" banner — not part of the story
  - { action: evaluate, script: "document.querySelectorAll('body > div:not(.todoapp), .info, [class*=banner]').forEach(e => { if (!e.querySelector('.new-todo')) e.style.display = 'none' })" }
steps:
  - action: scene
    label: empty
    caption: Start where every list starts
    camera: static
  - action: wait
    ms: 1200
  - action: click
    selector: input.new-todo
  - action: type
    selector: input.new-todo
    text: Book the flight to Lisbon
    delay: 45
  - action: keyboard
    key: Enter
    pauseAfter: 600
  - action: type
    selector: input.new-todo
    text: Send the deck before Thursday
    delay: 45
  - action: keyboard
    key: Enter
    pauseAfter: 800
  - action: scene
    label: added
    caption: Two things that need doing
    camera: static
  - action: wait
    ms: 1400
  - action: click
    selector: ".todo-list li:first-child .toggle"
    pauseAfter: 900
  - action: scene
    label: done
    caption: One of them is
    camera: static
  - action: wait
    ms: 1200
  - action: click
    selector: "a:has-text('Completed')"
    pauseAfter: 800
  - action: scene
    label: filtered
    caption: The list keeps the score
    camera: static
  - action: wait
    ms: 2200
outputs:
  mp4: true
  gif: false
  thumbnail:
    scene: done
